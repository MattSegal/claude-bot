[project]
name = "claude-bot"
version = "0.2.0"
description = "Slack bot that runs Claude Code sessions in leased repo checkouts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.18.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
claude-bot = "claude_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_bot"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "ty>=0.0.1a1",
    "prek>=0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter, except in strings/docstrings)
]

[tool.ruff.lint.isort]
known-first-party = ["claude_bot"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Ignore unresolved imports since ty hook runs in isolated env without project deps
unresolved-import = "ignore"
